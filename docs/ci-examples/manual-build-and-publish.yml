name: Manual build and publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        run: make install

      - name: Build publication outputs
        run: make build

      - name: Publish outputs
        run: |
          echo "Replace this step with your approved publication mechanism."
