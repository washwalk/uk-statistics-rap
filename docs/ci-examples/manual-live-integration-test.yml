name: Manual live integration test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Refresh live sources and validate
        run: make integration-test
