name: Build and Deploy Unified Statistics Site

on:
  push:
    branches: [main]
    paths:
      - "uk-labour-market-resilience-monitor/**"
      - "ons-retail-sales-rap/**"
      - "uk-housing-affordability-monitor/**"
      - "uk-inflation-monitor/**"
      - "uk-gdp-release-summary/**"
      - "uk-population-change-explorer/**"
      - "uk-bus-stop-standard-data-monitor/**"
      - "site/**"
      - ".github/workflows/pages.yml"

  workflow_dispatch:

  schedule:
    - cron: "20 8 * * 2"
    - cron: "0 9 28 * *"
    - cron: "18 7 15 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      labour_market: ${{ steps.filter.outputs.labour_market }}
      retail_sales: ${{ steps.filter.outputs.retail_sales }}
      housing_affordability: ${{ steps.filter.outputs.housing_affordability }}
      inflation: ${{ steps.filter.outputs.inflation }}
      gdp: ${{ steps.filter.outputs.gdp }}
      population: ${{ steps.filter.outputs.population }}
      bus_stop_standard: ${{ steps.filter.outputs.bus_stop_standard }}
      site: ${{ steps.filter.outputs.site }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect changed projects
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            labour_market:
              - 'uk-labour-market-resilience-monitor/**'
            retail_sales:
              - 'ons-retail-sales-rap/**'
            housing_affordability:
              - 'uk-housing-affordability-monitor/**'
            inflation:
              - 'uk-inflation-monitor/**'
            gdp:
              - 'uk-gdp-release-summary/**'
            population:
              - 'uk-population-change-explorer/**'
            bus_stop_standard:
              - 'uk-bus-stop-standard-data-monitor/**'
            site:
              - 'site/**'
            workflow:
              - '.github/workflows/pages.yml'

  ci-labour-market:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.labour_market == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: uk-labour-market-resilience-monitor
        run: python -m pip install -r requirements.txt

      - name: Validate labour market build
        working-directory: uk-labour-market-resilience-monitor
        run: |
          python src/fetch_ons.py
          python src/transform.py
          python src/validate.py
          python src/build_site.py

  ci-retail-sales:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.retail_sales == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        working-directory: ons-retail-sales-rap
        run: python -m pip install -r requirements.txt

      - name: Run tests
        working-directory: ons-retail-sales-rap
        run: python -m pytest

      - name: Build report
        working-directory: ons-retail-sales-rap
        run: |
          python -m src.pipeline
          quarto render reports/statistical_summary.qmd --output-dir ../outputs

  ci-housing-affordability:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.housing_affordability == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        working-directory: uk-housing-affordability-monitor
        run: python -m pip install -r requirements.txt

      - name: Build housing affordability site
        working-directory: uk-housing-affordability-monitor
        run: |
          python scripts/fetch_ons_data.py
          quarto render

  build-pages:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create staging directory
        run: mkdir -p _site

      - name: Set up Python 3.11 for labour market
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build labour market monitor
        working-directory: uk-labour-market-resilience-monitor
        run: |
          python -m pip install -r requirements.txt
          python src/fetch_ons.py
          python src/transform.py
          python src/validate.py
          python src/build_site.py
          mkdir -p ../_site/uk-labour-market-resilience-monitor
          cp -R docs/. ../_site/uk-labour-market-resilience-monitor/

      - name: Set up Python 3.12 for retail sales
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Quarto for retail and housing
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build retail sales report
        working-directory: ons-retail-sales-rap
        run: |
          python -m pip install -r requirements.txt
          python -m pytest
          python -m src.pipeline
          quarto render reports/statistical_summary.qmd --output-dir ${{ github.workspace }}/outputs
          mkdir -p ${{ github.workspace }}/_site/ons-retail-sales-rap
          cp -R ${{ github.workspace }}/outputs/. ${{ github.workspace }}/_site/ons-retail-sales-rap/
          cp ${{ github.workspace }}/outputs/statistical_summary.html ${{ github.workspace }}/_site/ons-retail-sales-rap/index.html
          cp -R outputs/figures ${{ github.workspace }}/_site/ons-retail-sales-rap/

      - name: Set up Python 3.11 for housing affordability
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build housing affordability monitor
        working-directory: uk-housing-affordability-monitor
        run: |
          python -m pip install -r requirements.txt
          python scripts/fetch_ons_data.py
          quarto render
          mkdir -p ../_site/uk-housing-affordability-monitor
          cp -R _site/. ../_site/uk-housing-affordability-monitor/

      - name: Copy committed compact example outputs
        run: |
          for project in uk-inflation-monitor uk-gdp-release-summary uk-population-change-explorer uk-bus-stop-standard-data-monitor; do
            if [ -d "$project/docs" ]; then
              mkdir -p "_site/$project"
              cp -R "$project/docs/." "_site/$project/"
            fi
          done

      - name: Build inflation monitor
        if: github.event_name != 'push' || needs.changes.outputs.inflation == 'true' || needs.changes.outputs.workflow == 'true'
        working-directory: uk-inflation-monitor
        run: |
          python -m unittest discover -s tests
          python src/validate.py
          python src/publish.py
          mkdir -p ../_site/uk-inflation-monitor
          cp -R docs/. ../_site/uk-inflation-monitor/

      - name: Build GDP release summary
        if: github.event_name != 'push' || needs.changes.outputs.gdp == 'true' || needs.changes.outputs.workflow == 'true'
        working-directory: uk-gdp-release-summary
        run: |
          python -m unittest discover -s tests
          python src/validate.py
          python src/publish.py
          mkdir -p ../_site/uk-gdp-release-summary
          cp -R docs/. ../_site/uk-gdp-release-summary/

      - name: Build population explorer
        if: github.event_name != 'push' || needs.changes.outputs.population == 'true' || needs.changes.outputs.workflow == 'true'
        working-directory: uk-population-change-explorer
        run: |
          python -m unittest discover -s tests
          python src/validate.py
          python src/publish.py
          mkdir -p ../_site/uk-population-change-explorer
          cp -R docs/. ../_site/uk-population-change-explorer/

      - name: Build bus stop standard monitor
        if: github.event_name != 'push' || needs.changes.outputs.bus_stop_standard == 'true' || needs.changes.outputs.workflow == 'true'
        working-directory: uk-bus-stop-standard-data-monitor
        env:
          BODS_API_KEY: ${{ secrets.BODS_API_KEY }}
          LIVE_BODS_REFRESH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 28 * *' }}
        run: |
          python -m unittest discover -s tests
          if [ "$LIVE_BODS_REFRESH" = "true" ] && [ -n "$BODS_API_KEY" ]; then
            python src/fetch.py
            python src/fetch_bods.py
            python src/transform.py
          fi
          python src/validate.py
          python src/publish.py
          mkdir -p ../_site/uk-bus-stop-standard-data-monitor
          cp -R docs/. ../_site/uk-bus-stop-standard-data-monitor/

      - name: Copy landing page assets
        run: cp -R site/. _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload unified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
